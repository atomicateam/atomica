name: Publish

# Publish to PyPI whenever main is updated (any push, not only PR merges),
# but only after the full test suite passes.
on:
  push:
    branches: [main]

# Ceiling for the reusable test job (its junit reporter needs checks: write);
# the build/publish jobs narrow this further at the job level.
permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  # Run the full cross-platform test suite (reusable workflow)
  test:
    uses: ./.github/workflows/tests.yml

  # Build sdist + wheel once, on a job with no publishing privileges
  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Build sdist and wheel
        run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # Publish via PyPI Trusted Publishing (OIDC) - no API token/secret needed
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/atomica
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # main can be pushed without a version bump; skip instead of failing
          # when the version already exists on PyPI
          skip-existing: true
