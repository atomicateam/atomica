name: Tests

on:
  workflow_dispatch:
  pull_request:
  workflow_call:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Python version comes from .python-version (read automatically by uv)
      - name: Install dependencies
        run: uv sync --extra test --no-default-groups --frozen

      # pytest config (junit, coverage, -n 2) lives in tox.ini [pytest]; these
      # flags add the notebook (nbval) validation that tox layered on top
      - name: Run tests
        run: uv run pytest --nbval-lax --current-env --nbval-cell-timeout=600 --dist loadscope --durations=25

      - name: Publish test results
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: junit/test-results.xml

      # Surface coverage in the Actions run summary (no PR comment). Only on
      # Linux: this is a Docker action, and coverage is the same across the OS
      # matrix, so one report avoids duplication.
      - name: Coverage summary
        uses: irongut/CodeCoverageSummary@v1.3.0
        if: always() && matrix.os == 'ubuntu-latest'
        continue-on-error: true
        with:
          filename: coverage.xml
          format: markdown
          output: both
      - name: Add coverage to job summary
        if: always() && matrix.os == 'ubuntu-latest'
        continue-on-error: true
        shell: bash
        run: cat code-coverage-results.md >> "$GITHUB_STEP_SUMMARY"
