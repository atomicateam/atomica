[tox]
envlist = py314
requires =
    tox-uv>=1

[testenv]
description = Run basic usage tests
runner = uv-venv-runner

# Change directory so that we make sure we are using the package-installed version
changedir = {envtmpdir}
extras = test

commands =
    pytest --nbval-lax --current-env --nbval-cell-timeout=600 --dist loadscope {toxinidir} {posargs}

[testenv:docs]
description = Build the documentation
runner = uv-venv-runner
changedir = {toxinidir}
extras = docs
commands =
    python -m sphinx.cmd.build docs {posargs:doc_build} -j2

# pytest configuration lives in pytest.ini (at the repo root, so testpaths that
# span tests/ and docs/ resolve correctly)

