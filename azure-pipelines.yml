schedules:
- cron: "0 13 * * *"
  displayName: Nightly build
  branches:
    include:
    - main
    - develop

jobs:
- job: 'tox'
  variables:
    python.version: '3.14'
    TOXENV: 'py314'
  strategy:
    matrix:
      linux:
        imageName: 'ubuntu-latest'
      mac:
        imageName: 'macos-latest'
      windows:
        imageName: 'windows-latest'
  pool:
    vmImage: $(imageName)
  steps:
    - task: UsePythonVersion@0
      displayName: 'Use Python $(python.version)'
      inputs:
        versionSpec: '$(python.version)'

    - script: python -m pip install --upgrade pip && python -m pip install tox tox-uv
      displayName: 'Install Tox'

    - script: tox -e $(TOXENV)
      displayName: 'Run Tox tests'

    - task: PublishTestResults@2
      inputs:
        testResultsFiles: '**/test-*.xml'
        testRunTitle: 'Publish test results for Python $(python.version)'
      condition: succeededOrFailed()

    - task: PublishCodeCoverageResults@2
      inputs:
        codeCoverageTool: Cobertura
        summaryFileLocation: '$(System.DefaultWorkingDirectory)/**/coverage.xml'
#        reportDirectory: '$(System.DefaultWorkingDirectory)/**/htmlcov'

# Documentation is built and published via GitHub Actions (.github/workflows/docs.yml)

- job: 'deploy'
  dependsOn: 'tox'
  condition: and(ne(variables['Build.Reason'], 'Schedule'),and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main')))
  pool:
    vmImage: 'ubuntu-latest'
  steps:
    - task: UsePythonVersion@0
      displayName: 'Select python version'
      inputs:
        versionSpec: '3.14'
    - script: |
        python -m pip install build
        python -m pip install twine
        python -m build
      displayName: 'Build Atomica'
    - task: TwineAuthenticate@1
      displayName: 'Twine Authenticate'
      inputs:
        pythonUploadServiceConnection: pypi_atomica
    - script: |
        python -m twine upload -r "pypi_atomica" --config-file $(PYPIRC_PATH) dist/*
      displayName: 'Upload to PyPI'

