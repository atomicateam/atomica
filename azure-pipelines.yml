schedules:
- cron: "0 13 * * *"
  displayName: Nightly build
  branches:
    include:
    - main
    - develop

jobs:
- job: 'tox'
  variables:
    python.version: '3.14'
    TOXENV: 'py314'
  strategy:
    matrix:
      linux:
        imageName: 'ubuntu-latest'
      mac:
        imageName: 'macos-latest'
      windows:
        imageName: 'windows-latest'
  pool:
    vmImage: $(imageName)
  steps:
    - task: UsePythonVersion@0
      displayName: 'Use Python $(python.version)'
      inputs:
        versionSpec: '$(python.version)'

    - script: python -m pip install --upgrade pip && python -m pip install tox tox-uv
      displayName: 'Install Tox'

    - script: tox -e $(TOXENV)
      displayName: 'Run Tox tests'

    - task: PublishTestResults@2
      inputs:
        testResultsFiles: '**/test-*.xml'
        testRunTitle: 'Publish test results for Python $(python.version)'
      condition: succeededOrFailed()

    - task: PublishCodeCoverageResults@2
      inputs:
        codeCoverageTool: Cobertura
        summaryFileLocation: '$(System.DefaultWorkingDirectory)/**/coverage.xml'
#        reportDirectory: '$(System.DefaultWorkingDirectory)/**/htmlcov'

# Documentation is built and published via GitHub Actions (.github/workflows/docs.yml)
# PyPI publishing is handled via GitHub Actions (.github/workflows/publish.yml)

